<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - PT Recycling</title>
    <meta name="description" content="Thank you for contacting PT Recycling. We've received your message and will get back to you soon.">
    <script src="js/preload.js"></script>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Inline styles to ensure immediate rendering without delay */
        .thank-you-actions {
            margin-top: 2rem;
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            align-items: center;
        }
        
        .thank-you-actions .secondary-button,
        .thank-you-actions .cta-button {
            min-width: 160px;
            width: 160px;
            text-align: center;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            padding: 0.7rem 1.2rem;
            font-size: 0.95rem;
            font-weight: 600;
            animation: none !important;
            transition: none !important;
            box-sizing: border-box;
            height: 44px; /* Fixed height for both buttons */
            margin: 0; /* Remove all margins */
            line-height: 1;
        }
        
        /* Override the default margin-top for secondary button */
        .thank-you-actions .secondary-button {
            margin-top: 0 !important;
        }
        
        @media (max-width: 768px) {
            .thank-you-actions {
                flex-direction: column;
                align-items: center;
                gap: 1rem;
            }
            
            .thank-you-actions .secondary-button,
            .thank-you-actions .cta-button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div id="navbar-placeholder"></div>
    <main>
        <section class="thank-you-section">
            <div class="thank-you-container">
                <h2>Thank You!</h2>
                <p>Your message has been sent successfully.</p>
                <p>We've received your inquiry and will get back to you as soon as possible.</p>
                <div class="thank-you-actions">
                    <a href="index.html" class="secondary-button">Return to Home</a>
                    <a href="services.html" class="cta-button">View Our Services</a>
                </div>
            </div>
        </section>
    </main>
    <div id="footer-placeholder"></div>
    <button class="dark-mode-toggle" aria-label="Toggle dark mode">🌙</button>
    <script src="js/main.js"></script>
    <script src="js/components.js"></script>
</body>
</html>
